name: Frontend CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    name: Frontend Build (yarn build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Build frontend
        env:
          REACT_APP_BACKEND_BASE_URL: http://localhost:1998
          REACT_APP_MAP_APIKEY: ci-placeholder-key
        run: yarn build
